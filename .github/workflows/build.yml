name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-tests:
    name: SoulseekCore tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install zlib headers
        run: |
          apt-get update -qq
          apt-get install -y -qq zlib1g-dev git
      - name: Run tests
        run: swift test

  build-ipa:
    name: Build unsigned IPA
    needs: linux-tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show build tools and schemes
        run: |
          xcodebuild -version
          xcodegen --version
          xcodebuild -project Slsk.xcodeproj -list

      - name: Build archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Slsk.xcodeproj \
            -scheme Slsk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Slsk.xcarchive \
            -resultBundlePath build/Slsk.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          test -f build/Slsk.xcarchive/Products/Applications/Slsk.app/Slsk
          mkdir -p build/Payload
          cp -R "build/Slsk.xcarchive/Products/Applications/Slsk.app" build/Payload/
          cd build
          zip -qry Slsk-unsigned.ipa Payload
          unzip -t Slsk-unsigned.ipa
          ls -lh Slsk-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slsk-unsigned-ipa
          path: build/Slsk-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Slsk-build-diagnostics
          path: |
            build/xcodebuild.log
            build/Slsk.xcresult
          if-no-files-found: ignore
          retention-days: 14
